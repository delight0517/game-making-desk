name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m unittest discover -s tests -v
      - run: node tests/question-state.cjs
      - run: node --check desk/desk.js
      - run: node --check desk/storyboard.js
      - run: node --check desk/immersive.js
      - shell: pwsh
        run: ./Build-Windows.ps1
